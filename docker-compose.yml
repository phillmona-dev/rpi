name: rpis

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: rpis-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rpis}
      POSTGRES_USER: ${POSTGRES_USER:-rpis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - rpis-db-data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rpis} -d ${POSTGRES_DB:-rpis}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: rpis-backend
    profiles: ["full"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-rpis}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rpis}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      RPIS_JWT_SECRET: ${RPIS_JWT_SECRET}
      RPIS_JWT_ACCESS_TTL_MINUTES: ${RPIS_JWT_ACCESS_TTL_MINUTES:-15}
      RPIS_JWT_REFRESH_TTL_HOURS: ${RPIS_JWT_REFRESH_TTL_HOURS:-8}
      RPIS_CORS_ALLOWED_ORIGINS: ${RPIS_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RPIS_DEMO_PASSWORD: ${RPIS_DEMO_PASSWORD:-Rpis@2026!}
      RPIS_MEDIA_DIR: /data/media
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
    volumes:
      - rpis-media:/data/media
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      # First boot runs migrations and seeds demo data; on a busy host that can take several minutes.
      start_period: 600s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/positron}
    container_name: rpis-frontend
    profiles: ["full"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      RPIS_API_BASE_URL: http://backend:8080
      NODE_ENV: production
      RPIS_COOKIE_SECURE: ${RPIS_COOKIE_SECURE:-true}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  rpis-db-data:
  rpis-media:
